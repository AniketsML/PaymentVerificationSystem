<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify OCR — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      background: #0B0C12;
      color: #F4F3F7;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: #7C5CFF; color: white; }

    .wc-container {
      width: 100%;
      min-height: 100vh;
      display: flex;
    }

    .wc-card { user-select: none; }
    .wc-dot { transition: width .35s ease, background .35s ease; }
    .wc-input:focus { outline: none; }
    .wc-btn-primary { transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
    .wc-btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 28px -10px rgba(124,92,255,.65); }
    .wc-btn-primary:active { transform: translateY(0px) scale(.98); }

    @keyframes wc-drift-1 {
      0%, 100% { transform: translate(-6%, -4%) scale(1); }
      50% { transform: translate(8%, 6%) scale(1.15); }
    }
    @keyframes wc-drift-2 {
      0%, 100% { transform: translate(4%, 8%) scale(1.05); }
      50% { transform: translate(-10%, -6%) scale(0.95); }
    }
    @keyframes wc-progress-fill {
      from { width: 0%; }
      to { width: 100%; }
    }

    @media (max-width: 860px) {
      .wc-left { display: none !important; }
      .wc-right { width: 100%; }
    }

    /* ── LEFT: Carousel Panel ── */
    .wc-left {
      position: relative;
      width: 56%;
      min-height: 100vh;
      padding: 40px 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background 900ms cubic-bezier(.4,0,.2,1);
      user-select: none;
      outline: none;
      cursor: grab;
    }
    .wc-left.grabbing { cursor: grabbing !important; }

    .wc-blobs-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .wc-blob-1 {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 60%;
      height: 60%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.35), transparent 70%);
      filter: blur(60px);
      animation: wc-drift-1 16s ease-in-out infinite;
    }
    .wc-blob-2 {
      position: absolute;
      bottom: -15%;
      right: -10%;
      width: 55%;
      height: 55%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,0,0,.4), transparent 70%);
      filter: blur(70px);
      animation: wc-drift-2 20s ease-in-out infinite;
    }

    .wc-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 15%, rgba(255,255,255,.14), transparent 45%),
                  radial-gradient(circle at 85% 90%, rgba(0,0,0,.35), transparent 55%);
      pointer-events: none;
    }

    .wc-brand {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .wc-sparkle {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: rgba(255,255,255,.16);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      flex: none;
    }
    .wc-brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 17px;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .wc-head-wrap {
      position: relative;
      z-index: 2;
      margin-top: 28px;
    }
    .wc-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.75;
      margin: 0 0 10px;
      color: #fff;
    }
    .wc-main-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(28px, 3vw, 40px);
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin: 0;
      max-width: 460px;
      color: #fff;
    }

    /* ── 3D Card Track ── */
    .wc-track {
      position: relative;
      z-index: 2;
      height: 300px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
    }
    .wc-tilt-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      transition: transform 260ms ease-out;
    }
    .wc-card {
      position: absolute;
      width: 280px;
      border-radius: 20px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(255,255,255,.22);
      backdrop-filter: blur(18px);
      user-select: none;
      transform-origin: center center;
    }
    .wc-card-avatar {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: rgba(255,255,255,.9);
      color: #25184F;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 16px;
    }
    .wc-card-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 19px;
      font-weight: 600;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
      color: #fff;
    }
    .wc-card-tag {
      font-size: 12.5px;
      opacity: 0.75;
      margin: 0 0 12px;
      font-family: 'JetBrains Mono', monospace;
      color: #fff;
    }
    .wc-card-blurb {
      font-size: 13.5px;
      line-height: 1.5;
      opacity: 0.92;
      margin: 0;
      color: #fff;
    }

    /* ── Controls: Centered Dots ── */
    .wc-controls {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
    }
    .wc-dots {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .wc-dot {
      height: 6px;
      width: 6px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      background: rgba(255,255,255,.35);
      transition: width .35s ease, background .35s ease;
    }
    .wc-dot.active {
      width: 26px;
      background: #FFFFFF;
    }

    /* ── Autoplay Progress Bar ── */
    .wc-progress-track {
      position: relative;
      z-index: 2;
      height: 2px;
      margin-top: 14px;
      border-radius: 2px;
      background: rgba(255,255,255,.18);
      overflow: hidden;
    }
    .wc-progress-bar {
      height: 100%;
      background: rgba(255,255,255,.9);
      border-radius: 2px;
      width: 0%;
    }
    .wc-progress-bar.animate {
      animation: wc-progress-fill 4800ms linear forwards;
    }

    /* ── RIGHT: Login Form Panel ── */
    .wc-right {
      flex: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      background: #0B0C12;
    }
    .wc-form-box {
      width: 100%;
      max-width: 380px;
    }
    .wc-form-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #8B8797;
      margin: 0 0 10px;
    }
    .wc-target-ws {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
    }
    .wc-target-badge {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      transition: background 600ms ease;
    }
    .wc-target-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 22px;
      margin: 0;
      letter-spacing: -0.01em;
      color: #F4F3F7;
    }

    .wc-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .wc-field {
      display: block;
    }
    .wc-field-lbl {
      font-size: 13px;
      color: #B4B0BE;
      margin-bottom: 7px;
      display: block;
    }
    .wc-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 11px;
      background: #15161F;
      border: 1px solid #26242F;
      color: #F4F3F7;
      font-size: 14.5px;
      font-family: inherit;
      transition: border-color .18s ease, box-shadow .18s ease;
      outline: none;
    }
    .wc-input:focus {
      border-color: #7C5CFF;
      box-shadow: 0 0 0 3px rgba(124,92,255,.25);
    }
    .wc-input::placeholder { color: #575463; }
    .wc-pw-wrap {
      position: relative;
    }
    .wc-pw-input {
      padding-right: 42px;
    }
    .wc-pw-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #8B8797;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .wc-pw-toggle:hover { color: #F4F3F7; }

    .wc-btn-primary {
      margin-top: 4px;
      width: 100%;
      padding: 13px 16px;
      border-radius: 11px;
      border: none;
      background: linear-gradient(135deg,#7C5CFF,#5B3DE0);
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .wc-btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px -10px rgba(124,92,255,.65);
    }
    .wc-btn-primary:active {
      transform: translateY(0px) scale(.98);
    }

    .wc-foot-text {
      font-size: 12.5px;
      color: #6E6A79;
      text-align: center;
      margin-top: 22px;
      line-height: 1.45;
    }
    .wc-foot-text a {
      color: #A99CFF;
      text-decoration: none;
      cursor: pointer;
    }
    .wc-foot-text a:hover { text-decoration: underline; }

    .wc-error {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,107,107,.13);
      color: #ff6b6b;
      border: 1px solid rgba(255,107,107,.3);
      border-radius: 9px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 16px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="wc-container">
    <!-- LEFT: interactive workspace carousel -->
    <div
      class="wc-left"
      id="wcLeftPanel"
      tabindex="0"
      role="group"
      aria-label="Workspace selector"
    >
      <!-- animated mesh-gradient blobs -->
      <div class="wc-blobs-layer">
        <div class="wc-blob-1"></div>
        <div class="wc-blob-2"></div>
      </div>

      <!-- ambient vignette -->
      <div class="wc-vignette"></div>

      <!-- top-left brand mark -->
      <div class="wc-brand">
        <div class="wc-sparkle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
        </div>
        <span class="wc-brand-title">Verify&nbsp;OCR</span>
      </div>

      <!-- headline -->
      <div class="wc-head-wrap">
        <p class="wc-eyebrow">Pick a workspace to continue</p>
        <h1 class="wc-main-title">Drag through your teams. Sign in to the one you need.</h1>
      </div>

      <!-- 3D CARD STACK -->
      <div class="wc-track" id="wcTrack">
        <div class="wc-tilt-layer" id="wcTiltLayer"></div>
      </div>

      <!-- controls: centered dots -->
      <div class="wc-controls">
        <div class="wc-dots" id="wcDots"></div>
      </div>

      <!-- autoplay progress bar -->
      <div class="wc-progress-track">
        <div class="wc-progress-bar" id="wcProgressBar"></div>
      </div>
    </div>

    <!-- RIGHT: login form -->
    <div class="wc-right">
      <div class="wc-form-box">
        <p class="wc-form-eyebrow">Signing in to</p>
        <div class="wc-target-ws">
          <div class="wc-target-badge" id="targetBadge">A</div>
          <h2 class="wc-target-name" id="targetName">Aurora Labs</h2>
        </div>

        {% if error %}
        <div class="wc-error" role="alert">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5" stroke-linecap="round"/></svg>
          {{ error }}
        </div>
        {% endif %}

        <form method="post" autocomplete="on" novalidate id="loginForm" class="wc-form">
          <input type="hidden" name="workspace" id="workspaceInput" value="payment">

          <label class="wc-field">
            <span class="wc-field-lbl">Email</span>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="you@company.com"
              class="wc-input"
              autocomplete="username"
              autofocus
              required
            >
          </label>

          <label class="wc-field">
            <span class="wc-field-lbl">Password</span>
            <div class="wc-pw-wrap">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••••"
                class="wc-input wc-pw-input"
                autocomplete="current-password"
                required
              >
              <button
                type="button"
                id="pwToggle"
                class="wc-pw-toggle"
                tabindex="-1"
                aria-label="Toggle password visibility"
              >
                <svg id="eyeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </label>

          <button type="submit" class="wc-btn-primary" id="submitBtn">
            <span id="submitBtnText">Continue to Aurora Labs</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>

        <p class="wc-foot-text">
          Not on <span id="footTargetName">Aurora Labs</span>?
          <a href="#" id="switchPromptLink">Switch workspace</a> using the panel on the left.
        </p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const WORKSPACES = [
        {
          id: "payment",
          name: "Payment Verification",
          short: "Payment",
          tag: "Product design",
          members: 42,
          gradient: "linear-gradient(135deg,#3D2C8D 0%,#7C5CFF 55%,#B99CFF 100%)",
          blurb: "Deterministic verification for loan repayments, bank receipts, UPI screenshots, and closure certificates with zero false positives.",
        },
        {
          id: "legal",
          name: "Legal Notice Extraction",
          short: "Legal",
          tag: "Statutory & Verbatim",
          members: 18,
          gradient: "linear-gradient(135deg,#1E293B 0%,#5B4CC7 60%,#FF8A4C 130%)",
          blurb: "Exact formatting, verbatim legal text reproduction, structured numbered clauses, advocate parsing, and statutory compliance checks.",
        },
        {
          id: "invoice",
          name: "Invoice & Tax OCR",
          short: "Invoice",
          tag: "Infrastructure",
          members: 96,
          gradient: "linear-gradient(135deg,#101828 0%,#334155 55%,#7C5CFF 120%)",
          blurb: "Line item table extraction, GSTIN validation, HSN breakdown, and multi-currency ledger reconciliation.",
        },
        {
          id: "kyc",
          name: "Identity & KYC",
          short: "KYC",
          tag: "Research",
          members: 11,
          gradient: "linear-gradient(135deg,#2D1B4E 0%,#8B5CF6 55%,#FDBA74 130%)",
          blurb: "Aadhaar, PAN, Passport, and Voter ID tamper-detection and optical character recognition.",
        },
        {
          id: "contracts",
          name: "Contract Analysis",
          short: "Contracts",
          tag: "Community",
          members: 230,
          gradient: "linear-gradient(135deg,#171923 0%,#4C3D9E 60%,#60A5FA 130%)",
          blurb: "Master service agreements, lease covenants, indemnity clauses, and jurisdiction risk auditing.",
        },
      ];

      const AUTOPLAY_MS = 4800;
      const count = WORKSPACES.length;
      let active = 0;
      let dragX = 0;
      let isDragging = false;
      let paused = false;
      let userInteracted = false;
      let tilt = { x: 0, y: 0 };
      let dragStart = null;
      let timer = null;

      const leftPanel = document.getElementById("wcLeftPanel");
      const tiltLayer = document.getElementById("wcTiltLayer");
      const dotsWrap = document.getElementById("wcDots");
      const progressBar = document.getElementById("wcProgressBar");
      const targetBadge = document.getElementById("targetBadge");
      const targetName = document.getElementById("targetName");
      const footTargetName = document.getElementById("footTargetName");
      const submitBtnText = document.getElementById("submitBtnText");
      const workspaceInput = document.getElementById("workspaceInput");
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const loginForm = document.getElementById("loginForm");

      // Initial active workspace from URL params or localStorage
      const urlParams = new URLSearchParams(window.location.search);
      const nextParam = urlParams.get("next") || "";
      const wsParam = urlParams.get("workspace") || (nextParam.includes("legal") ? "legal" : (nextParam.includes("payment") ? "payment" : ""));
      const savedWs = wsParam || localStorage.getItem("pv-active-workspace") || "payment";
      const foundIdx = WORKSPACES.findIndex(w => w.id === savedWs);
      if (foundIdx >= 0) {
        active = foundIdx;
        if (wsParam) userInteracted = true;
      }

      let cardElements = [];
      let dotElements = [];

      // Build DOM elements once
      function initDom() {
        tiltLayer.innerHTML = "";
        dotsWrap.innerHTML = "";

        cardElements = WORKSPACES.map((ws, i) => {
          const card = document.createElement("div");
          card.className = "wc-card";
          card.innerHTML = `
            <div>
              <div class="wc-card-avatar">${ws.name.charAt(0)}</div>
              <h3 class="wc-card-name">${ws.name}</h3>
              <p class="wc-card-tag">${ws.tag} · ${ws.members} members</p>
              <p class="wc-card-blurb">${ws.blurb}</p>
            </div>
          `;
          card.onclick = () => {
            if (!isDragging) goTo(i, true);
          };
          tiltLayer.appendChild(card);
          return card;
        });

        dotElements = WORKSPACES.map((ws, i) => {
          const dot = document.createElement("button");
          dot.className = "wc-dot";
          dot.type = "button";
          dot.setAttribute("aria-label", "Go to " + ws.name);
          dot.onclick = () => goTo(i, true);
          dotsWrap.appendChild(dot);
          return dot;
        });
      }

      function stopTimer() {
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
        updateProgressBar();
      }

      function resetTimer() {
        stopTimer();
        if (userInteracted || paused || isDragging) {
          updateProgressBar();
          return;
        }
        if ((usernameInput && usernameInput.value) || (passwordInput && passwordInput.value)) {
          updateProgressBar();
          return;
        }
        updateProgressBar();
        timer = setInterval(() => next(false), AUTOPLAY_MS);
      }

      function updateProgressBar() {
        if (paused || isDragging || userInteracted || (usernameInput && usernameInput.value) || (passwordInput && passwordInput.value)) {
          progressBar.classList.remove("animate");
          progressBar.style.width = "0%";
        } else {
          progressBar.classList.remove("animate");
          void progressBar.offsetWidth;
          progressBar.classList.add("animate");
        }
      }

      function goTo(idx, isManual = false) {
        if (isManual) {
          userInteracted = true;
          stopTimer();
        }
        active = ((idx % count) + count) % count;
        render();
      }

      function next(isManual = false) { goTo(active + 1, isManual); }
      function prev(isManual = false) { goTo(active - 1, isManual); }

      function updateTilt() {
        tiltLayer.style.transform = `rotateY(${tilt.x * 8}deg) rotateX(${-tilt.y * 8}deg) translateX(${tilt.x * 10}px)`;
        tiltLayer.style.transition = isDragging ? "none" : "transform 260ms ease-out";
      }

      function render() {
        const cur = WORKSPACES[active];
        leftPanel.style.background = cur.gradient;

        // Sync right form panel
        targetBadge.style.background = cur.gradient;
        targetBadge.textContent = cur.short.charAt(0);
        targetName.textContent = cur.name;
        footTargetName.textContent = cur.name;
        submitBtnText.textContent = "Continue to " + cur.name;
        workspaceInput.value = cur.id;
        localStorage.setItem("pv-active-workspace", cur.id);

        updateTilt();

        // Update cards with exact JSX styles
        cardElements.forEach((card, i) => {
          let offset = i - active;
          if (offset > count / 2) offset -= count;
          if (offset < -count / 2) offset += count;
          const isCurrent = offset === 0;

          const dx = offset * 46 + (isDragging ? dragX * 0.14 : 0);
          const scale = isCurrent ? 1 - Math.min(Math.abs(dragX) / 2200, 0.05) : 0.86 - Math.abs(offset) * 0.05;
          const rotate = offset * 6 + (isCurrent ? dragX * 0.02 : 0);
          const opacity = Math.abs(offset) > 2 ? 0 : isCurrent ? 1 : 0.55 - Math.abs(offset) * 0.12;
          const z = 50 - Math.abs(offset);

          card.style.height = isCurrent ? "268px" : "240px";
          card.style.background = isCurrent ? "rgba(255,255,255,.14)" : "rgba(255,255,255,.08)";
          card.style.boxShadow = isCurrent ? "0 30px 60px -20px rgba(0,0,0,.55)" : "0 14px 30px -18px rgba(0,0,0,.4)";
          card.style.transform = `translateX(${dx}px) scale(${scale}) rotate(${rotate}deg)`;
          card.style.opacity = opacity;
          card.style.zIndex = z;
          card.style.cursor = isCurrent ? "default" : "pointer";
          card.style.transition = isDragging
            ? "none"
            : "transform 520ms cubic-bezier(.22,1,.36,1), opacity 420ms ease, height 420ms ease, background 420ms ease";

          const blurb = card.querySelector(".wc-card-blurb");
          if (blurb) {
            blurb.style.display = isCurrent ? "block" : "none";
          }
        });

        // Update dots
        dotElements.forEach((dot, i) => {
          const isCurrent = i === active;
          dot.style.width = isCurrent ? "26px" : "6px";
          dot.style.background = isCurrent ? "#FFFFFF" : "rgba(255,255,255,.35)";
        });

        resetTimer();
      }

      // Pointer Drag & Swipe handling exactly as in JSX
      function onPointerDown(e) {
        dragStart = e.clientX ?? e.touches?.[0]?.clientX;
        isDragging = true;
        leftPanel.classList.add("grabbing");
        stopTimer();
      }

      function onPointerMove(e) {
        if (dragStart === null) return;
        const x = e.clientX ?? e.touches?.[0]?.clientX;
        if (x === undefined) return;
        dragX = x - dragStart;
        render();
      }

      function endDrag() {
        if (dragStart === null) return;
        if (dragX < -60) next(true);
        else if (dragX > 60) prev(true);
        dragStart = null;
        dragX = 0;
        isDragging = false;
        leftPanel.classList.remove("grabbing");
        render();
      }

      // Mouse-tilt parallax exactly as in JSX
      function onPanelMouseMove(e) {
        onPointerMove(e);
        const rect = leftPanel.getBoundingClientRect();
        const px = (e.clientX - rect.left) / rect.width - 0.5;
        const py = (e.clientY - rect.top) / rect.height - 0.5;
        tilt = { x: px, y: py };
        updateTilt();
      }

      function onPanelMouseLeave() {
        paused = false;
        tilt = { x: 0, y: 0 };
        updateTilt();
        resetTimer();
      }

      leftPanel.addEventListener("mouseenter", () => { paused = true; stopTimer(); });
      leftPanel.addEventListener("mouseleave", onPanelMouseLeave);
      leftPanel.addEventListener("mousedown", onPointerDown);
      leftPanel.addEventListener("mousemove", onPanelMouseMove);
      window.addEventListener("mouseup", endDrag);

      leftPanel.addEventListener("touchstart", onPointerDown, { passive: true });
      window.addEventListener("touchmove", onPointerMove, { passive: true });
      window.addEventListener("touchend", endDrag);

      leftPanel.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") next(true);
        if (e.key === "ArrowLeft") prev(true);
      });

      // Two-finger trackpad swipe support exactly as in JSX
      let wheelAccum = 0;
      let wheelCooldown = false;
      let wheelResetTimer = null;

      leftPanel.addEventListener("wheel", (e) => {
        if (Math.abs(e.deltaX) < Math.abs(e.deltaY)) return;

        e.preventDefault();
        if (wheelCooldown) return;

        wheelAccum += e.deltaX;

        clearTimeout(wheelResetTimer);
        wheelResetTimer = setTimeout(() => {
          wheelAccum = 0;
        }, 150);

        const THRESHOLD = 60;
        if (wheelAccum > THRESHOLD) {
          next(true);
          wheelAccum = 0;
          wheelCooldown = true;
          setTimeout(() => (wheelCooldown = false), 450);
        } else if (wheelAccum < -THRESHOLD) {
          prev(true);
          wheelAccum = 0;
          wheelCooldown = true;
          setTimeout(() => (wheelCooldown = false), 450);
        }
      }, { passive: false });

      document.getElementById("switchPromptLink").onclick = (e) => {
        e.preventDefault();
        next(true);
      };

      // Form interactions: stop autoplay when typing or focusing inputs
      const stopOnFormInteraction = () => {
        userInteracted = true;
        stopTimer();
      };

      if (usernameInput) {
        usernameInput.addEventListener("focus", stopOnFormInteraction);
        usernameInput.addEventListener("input", stopOnFormInteraction);
      }
      if (passwordInput) {
        passwordInput.addEventListener("focus", stopOnFormInteraction);
        passwordInput.addEventListener("input", stopOnFormInteraction);
      }
      if (loginForm) {
        loginForm.addEventListener("click", stopOnFormInteraction);
      }

      // Password visibility toggle
      const pw = document.getElementById("password");
      const pwToggle = document.getElementById("pwToggle");
      let showPass = false;

      pwToggle.onclick = function () {
        showPass = !showPass;
        pw.type = showPass ? "text" : "password";
        pwToggle.innerHTML = showPass
          ? `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>`
          : `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
      };

      initDom();
      render();
    })();
  </script>
</body>
</html>
